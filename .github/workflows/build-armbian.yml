name: build-armbian

# 云端编译 Armbian for RK3566 EVB2 LP4X V10
# 推送仓库 -> Actions -> build-armbian -> Run workflow -> 约 40~90 分钟后下载 artifact

on:
  workflow_dispatch:
    inputs:
      release:
        description: "发行版 (jammy=Ubuntu22.04 / bookworm / noble / trixie)"
        type: choice
        options: [jammy, bookworm, noble, trixie]
        default: bookworm
      branch:
        description: "内核分支 (current / edge)"
        type: choice
        options: [current, edge]
        default: current
      minimal:
        description: "最小化镜像（不含桌面）"
        type: boolean
        default: true
      desktop:
        description: "构建桌面版（勾选后忽略 minimal）"
        type: boolean
        default: false
      desktop_env:
        description: "桌面环境（仅 desktop=true 时生效）"
        type: choice
        options: [xfce, mate, cinnamon, gnome, kde-plasma]
        default: xfce
      desktop_tier:
        description: "桌面档位 minimal=仅桌面 / mid=含浏览器 / full=含办公套件"
        type: choice
        options: [minimal, mid, full]
        default: mid
  push:
    paths:
      - "dts/**"
      - "drivers/**"
      - "userpatches/**"
      - ".github/workflows/build-armbian.yml"

permissions:
  contents: read

concurrency:
  group: build-armbian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 环境自检（dtb 必须在）
        run: |
          set -e
          test -f userpatches/dtb/rk3566-evb2-lp4x-v10.dtb || { echo "缺少 userpatches/dtb/*.dtb"; exit 1; }
          BOARD_FILE=$(ls userpatches/config/boards/rk3566-evb2-lp4x-v10.* | head -1)
          echo "board config: $BOARD_FILE"
          ls -l userpatches/dtb/ dts/
          df -h /

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/az /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/pipx
          sudo apt-get clean
          df -h /

      - name: 增加 swap（防止内核编译 OOM）
        run: |
          echo "--- before ---"; free -h; sudo swapon --show || true
          # 托管 runner 自带的 /swapfile 正在使用中（fallocate 会报 Text file busy），
          # 所以另开一个文件，只在现有 swap 不足 4GB 时添加
          CUR_MB=$(free -m | awk '/^Swap:/{print $2}')
          if [ "${CUR_MB:-0}" -lt 4096 ]; then
            sudo rm -f /swapfile2
            sudo fallocate -l 6G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=6144
            sudo chmod 600 /swapfile2
            sudo mkswap /swapfile2
            sudo swapon /swapfile2
          else
            echo "已有 ${CUR_MB}MB swap，跳过"
          fi
          echo "--- after ---"; free -h; df -h /

      - name: 注册 qemu binfmt（arm64 chroot 必需）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 获取 Armbian 构建框架
        run: git clone --depth 1 https://github.com/armbian/build.git build

      - name: 注入板级支持
        run: |
          set -e
          mkdir -p build/userpatches
          cp -rv userpatches/config build/userpatches/
          cp -rv userpatches/dtb    build/userpatches/
          # 新版 Armbian（python 补丁系统）的用户补丁目录不带 patch/ 层：
          # build/userpatches/kernel/archive/<series>/（日志 "User patches directory
          # for kernel [/armbian/userpatches/kernel/archive/rockchip64-6.18]"）。
          # 旧版补丁层路径也一并保留，兼容两种布局。
          if [ -d userpatches/patch ]; then
            cp -rv userpatches/patch build/userpatches/
            mkdir -p build/userpatches/kernel
            cp -rv userpatches/patch/kernel/. build/userpatches/kernel/
          fi
          if [ -d userpatches/kernel ]; then
            mkdir -p build/userpatches/kernel
            cp -rv userpatches/kernel/. build/userpatches/kernel/
          fi
          [ -d userpatches/firmware ] && cp -rv userpatches/firmware build/userpatches/ || true
          # 镜像定制钩子：桌面安装完成后固化屏幕方向(left) + 触摸标定/跟随
          # （框架 lib/functions/rootfs/customize.sh 会调用 build/userpatches/customize-image.sh）
          cp -v userpatches/customize-image.sh build/userpatches/
          chmod +x build/userpatches/customize-image.sh
          ls -lR build/userpatches/kernel 2>/dev/null || true
          ls -l build/userpatches/dtb/ build/userpatches/config/boards/
          # 桌面镜像专属：configng 的 common.yaml 桌面列表按 noble+ 编写，
          # jammy arm64 缺 pipewire-libcamera / gstreamer1.0-libcamera /
          # glmark2-x11 / glmark2-es2-x11，apt 会整体拒绝安装导致构建中止。
          # 补丁会校验锚点存在，框架改版时立刻失败而不是白跑两小时。
          bash tools/patch-jammy-desktop.sh build

      - name: 编译 Armbian
        working-directory: build
        env:
          RELEASE: ${{ inputs.release || 'bookworm' }}
          BRANCH: ${{ inputs.branch || 'current' }}
          DESKTOP: ${{ inputs.desktop || 'false' }}
          MINIMAL_FLAG: ${{ inputs.minimal == false && 'no' || 'yes' }}
          DE: ${{ inputs.desktop_env || 'xfce' }}
          TIER: ${{ inputs.desktop_tier || 'mid' }}
        run: |
          set -o pipefail
          # 桌面版开关：BUILD_DESKTOP=yes 必须配 BUILD_MINIMAL=no。
          # 桌面环境由 armbian-config(configng) 的 YAML 定义驱动，可选
          # xfce/mate/cinnamon/gnome/kde-plasma，档位 minimal/mid/full
          # （minimal=DE+DM+基础工具，mid=+浏览器，full=+LibreOffice 等）。
          DESKTOP_ARGS=()
          if [ "${DESKTOP}" = "true" ]; then
            BUILD_MINIMAL=no
            BUILD_DESKTOP=yes
            DESKTOP_ARGS=(DESKTOP_ENVIRONMENT="${DE}" DESKTOP_TIER="${TIER}")
            echo "==> 桌面构建: env=${DE} tier=${TIER}"
          else
            BUILD_MINIMAL="${MINIMAL_FLAG}"
            BUILD_DESKTOP=no
            echo "==> 命令行构建: minimal=${BUILD_MINIMAL}"
          fi
          # USE_LOCAL_APT_DEB_CACHE=no：关闭「宿主 apt 缓存拷贝进镜像」优化。
          # 托管 runner 上该缓存多次产出损坏的 lists 文件，导致镜像内
          # apt-get update 报 getline (12: Cannot allocate memory) 而构建失败。
          #
          # 注意：面板驱动用的是 Armbian 内置 panel-dsi-simple（panel-simple-dsi.ko），
          # 不需要内核补丁。触摸需要内核补丁（silead.c 的 GSLX680 下载协议），
          # 所以必须 ARTIFACT_IGNORE_CACHE=yes —— 内核 artifact 的缓存哈希不含
          # userpatches 内容，命中缓存会导致补丁从未被编译进去。
          ARTIFACT_IGNORE_CACHE=yes \
          ./compile.sh build \
            BOARD=rk3566-evb2-lp4x-v10 \
            BRANCH="${BRANCH}" \
            RELEASE="${RELEASE}" \
            BUILD_MINIMAL="${BUILD_MINIMAL}" \
            BUILD_DESKTOP="${BUILD_DESKTOP}" \
            "${DESKTOP_ARGS[@]}" \
            KERNEL_CONFIGURE=no \
            EXPERT=yes \
            USE_LOCAL_APT_DEB_CACHE=no \
            SHARE_LOG=no

      - name: 编译 AIC8800 + RK960 无线/蓝牙驱动（在 Armbian 构建容器内，环境与内核完全一致）
        working-directory: build
        run: |
          set -e
          KREL=$(ls -d cache/sources/linux-kernel-worktree/*/ | head -1)
          echo "KSRC=$KREL"
          test -f "${KREL}.config" || { echo "内核树缺少 .config"; exit 1; }
          # 必须在 Armbian 的 docker 构建容器里编：
          #  - 宿主机没有交叉 gcc（工具链在镜像内）
          #  - 内核树里的 modpost 等宿主工具是容器内 glibc2.38 构建的，
          #    在 runner 宿主机(glibc2.35) 上跑不了
          #  - gcc 版本、modpost、BTI/PAC 代码生成必须与内核构建时完全一致，
          #    否则 insmod 会在 ftrace_init_nop -> patch_map 触发 BUG（实测）
          IMG=ghcr.io/armbian/docker-armbian-build:armbian-debian-trixie-latest
          docker image inspect "$IMG" >/dev/null 2>&1 || docker pull "$IMG"
          docker run --rm \
            -v "$PWD:/work" -v "$GITHUB_WORKSPACE:/src" -w /work \
            -e KREL="$KREL" \
            "$IMG" bash -lc '
              set -e
              cd "/work/$KREL"
              echo -n "kernel build gcc: "; grep -m1 -oP "Linux version.*" include/generated/compile.h 2>/dev/null || true
              echo -n "container gcc: "; aarch64-linux-gnu-gcc --version | head -1
              make M=/src/drivers/aic8800 ARCH=arm64 \
                   CROSS_COMPILE=aarch64-linux-gnu- \
                   KCFLAGS="-Wno-error" -k -j"$(nproc)" modules
              # ---- RK960 WiFi 驱动（首次编译，失败不阻断镜像产出，只发 warning）----
              if make M=/src/drivers/rk960 ARCH=arm64 \
                   CROSS_COMPILE=aarch64-linux-gnu- \
                   KCFLAGS="-Wno-error" -k -j"$(nproc)" modules; then
                echo "RK960_BUILD=ok" >> /src/rk960-build.status
              else
                echo "RK960_BUILD=failed" >> /src/rk960-build.status
                echo "::warning::rk960 驱动编译失败，查看上方日志（6.18 API 兼容问题需逐个修）"
              fi
              # ---- rk_hciattach 用户态 BT 加载工具 ----
              mkdir -p /src/out-bt
              # -static: CI cross-gcc links GLIBC_2.38, board bookworm only has 2.36
              if aarch64-linux-gnu-gcc -O2 -Wall -D_GNU_SOURCE -static -I/src/tools/rk-hciattach \
                   -DFIRMWARE_DIR=\""/lib/firmware/"\" \
                   -o /src/out-bt/rk_hciattach \
                   /src/tools/rk-hciattach/hciattach.c /src/tools/rk-hciattach/hciattach_rk.c 2>/src/out-bt/build.log; then
                echo "HCIATTACH_BUILD=ok" >> /src/rk960-build.status
              else
                echo "HCIATTACH_BUILD=failed" >> /src/rk960-build.status
                echo "::warning::rk_hciattach 编译失败"; tail -20 /src/out-bt/build.log || true
              fi
              # ---- 导出内核自带的 hi846.ko：相机调试时可直接 scp 换掉模块，免整镜像刷写 ----
              mkdir -p /src/out-mod
              cp -v drivers/media/i2c/hi846.ko /src/out-mod/ 2>/dev/null \
                || echo "::warning::hi846.ko 未找到（CONFIG_VIDEO_HI846 可能不是 =m）"
            '
          cat "$GITHUB_WORKSPACE"/rk960-build.status 2>/dev/null || true
          ls -l "$GITHUB_WORKSPACE"/drivers/aic8800/*/*.ko
          modinfo -F vermagic "$GITHUB_WORKSPACE"/drivers/aic8800/aic8800_bsp/aic8800_bsp.ko
          ls -l "$GITHUB_WORKSPACE"/drivers/rk960/*.ko 2>/dev/null || echo "rk960.ko 未产出（见 warning）"
          file "$GITHUB_WORKSPACE"/out-bt/rk_hciattach 2>/dev/null || true

      - name: 上传驱动模块（失败也能单独装到板上）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-modules
          path: |
            drivers/aic8800/*/*.ko
            drivers/rk960/*.ko
            out-bt/*
            out-mod/*
            rk960-build.status
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 6

      - name: 把 AIC8800 驱动注入镜像 rootfs
        run: |
          set -e
          IMG=$(ls build/output/images/*.img | head -1)
          echo "image: $IMG"
          LOOP=$(sudo losetup -fP --show "$IMG")
          echo "loop: $LOOP"
          sudo partprobe "$LOOP" || true
          sleep 2
          ROOTPART="${LOOP}p1"
          [ -b "$ROOTPART" ] || ROOTPART=$(ls ${LOOP}p* | tail -1)
          echo "rootfs: $ROOTPART"
          sudo mkdir -p /mnt/r
          sudo mount "$ROOTPART" /mnt/r
          KVER=$(ls /mnt/r/lib/modules | head -1)
          echo "KVER=$KVER"
          sudo mkdir -p "/mnt/r/lib/modules/$KVER/extra"
          sudo cp drivers/aic8800/*/*.ko "/mnt/r/lib/modules/$KVER/extra/"
          sudo depmod -b /mnt/r "$KVER"
          grep -q aic8800 "/mnt/r/lib/modules/$KVER/modules.dep" && echo "✅ modules.dep 已含 aic8800"
          printf 'aic8800_bsp\naic8800_fdrv\n' | sudo tee /mnt/r/etc/modules-load.d/aic8800.conf
          # 固件实际在 /lib/firmware/aic8800/SDIO/<芯片>/ 下，用模块参数覆盖默认路径
          sudo mkdir -p /mnt/r/etc/modprobe.d
          printf 'options aic8800_bsp aic_fw_path=/lib/firmware/aic8800/SDIO/aic8800D80\n' \
            | sudo tee /mnt/r/etc/modprobe.d/aic8800.conf
          # ---- RK960 WiFi/BT 注入（编译成功才有 .ko；失败不阻断镜像）----
          if [ -f drivers/rk960/rk960.ko ]; then
            sudo cp drivers/rk960/rk960.ko "/mnt/r/lib/modules/$KVER/extra/"
            sudo depmod -b /mnt/r "$KVER"
            grep -q rk960 "/mnt/r/lib/modules/$KVER/modules.dep" && echo "✅ modules.dep 已含 rk960"
            # 驱动用 filp_open 直读 /lib/firmware/rk960_wifi*.bin（fw_path 内置含 /lib/firmware）
            sudo cp firmware/rk960/rk960_wifi*.bin /mnt/r/lib/firmware/
            sudo cp firmware/rk960/rk960_bt*.bin   /mnt/r/lib/firmware/
            # 厂商 init 脚本以 fw_no_sleep=1 加载
            printf 'options rk960 fw_no_sleep=1\n' | sudo tee /mnt/r/etc/modprobe.d/rk960.conf
            echo rk960 | sudo tee /mnt/r/etc/modules-load.d/rk960.conf
          else
            echo "!! rk960.ko 未产出，镜像不含 WiFi 驱动（本轮仅交付相机+按键）"
          fi
          if [ -f out-bt/rk_hciattach ] && file out-bt/rk_hciattach | grep -q ARM; then
            sudo cp out-bt/rk_hciattach /mnt/r/usr/local/bin/
            sudo chmod 755 /mnt/r/usr/local/bin/rk_hciattach
            # BT 初始化脚本：B7(GPIO2_B7=79) 复位脉冲 + hciattach @115200（ROM 播报/下载波特率）
            # 注意：BT 固件下载要求芯片尚未跑 WiFi 固件，故 rk960 由脚本在 BT 成功后 modprobe
            sudo cp tools/rk960-bt-init.sh /mnt/r/usr/local/bin/rk960-bt-init.sh
            sudo chmod 755 /mnt/r/usr/local/bin/rk960-bt-init.sh
            printf '%s\n' \
              '[Unit]' \
              'Description=RK960 Bluetooth init (hciattach) + WiFi driver load' \
              'After=multi-user.target' \
              'StartLimitIntervalSec=0' \
              '[Service]' \
              'Type=simple' \
              'ExecStart=/usr/local/bin/rk960-bt-init.sh' \
              'Restart=on-failure' \
              'RestartSec=20' \
              'TimeoutStartSec=600' \
              '[Install]' \
              'WantedBy=multi-user.target' \
              | sudo tee /mnt/r/etc/systemd/system/rk960-bt.service > /dev/null
            sudo mkdir -p /mnt/r/etc/systemd/system/multi-user.target.wants
            sudo ln -sf /etc/systemd/system/rk960-bt.service \
              /mnt/r/etc/systemd/system/multi-user.target.wants/rk960-bt.service
            # WiFi 驱动不再用 modules-load 自启动（顺序：BT 先、WiFi 后），去掉 rk960 自加载
            sudo rm -f /mnt/r/etc/modules-load.d/rk960.conf
            echo "✅ rk_hciattach + rk960-bt.service(BT优先初始化) 已注入"
          else
            echo "!! rk_hciattach 未产出，镜像不含 BT 用户态工具"
          fi
          # ---- bluez 兜底：PACKAGE_LIST_BOARD 未生效时 chroot 补装 ----
          # 首版镜像实测：minimal 不带 bluez，hciconfig/bluetoothctl 全缺，
          # rk960-bt.service 的完成判定因此失效。
          if sudo chroot /mnt/r /bin/sh -c 'command -v hciconfig' >/dev/null 2>&1; then
            echo "✅ bluez 已在镜像中"
          else
            echo "!! 镜像缺 bluez，chroot 补装"
            sudo mount --bind /dev  /mnt/r/dev
            sudo mount --bind /proc /mnt/r/proc
            sudo mount --bind /sys  /mnt/r/sys
            sudo cp /etc/resolv.conf /mnt/r/etc/resolv.conf || true
            sudo chroot /mnt/r /bin/bash -c \
              'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y --no-install-recommends bluez bluez-tools rfkill' \
              || echo "!! bluez 安装失败（镜像将缺少蓝牙用户态工具）"
            sudo umount /mnt/r/sys /mnt/r/proc /mnt/r/dev || true
          fi
          # chroot 里 apt 通常不会 enable 服务，显式挂上蓝牙开机自启
          if [ -f /mnt/r/lib/systemd/system/bluetooth.service ]; then
            sudo mkdir -p /mnt/r/etc/systemd/system/multi-user.target.wants
            sudo ln -sf /lib/systemd/system/bluetooth.service \
              /mnt/r/etc/systemd/system/multi-user.target.wants/bluetooth.service
            echo "✅ bluetooth.service 已设为开机自启"
          fi
          sudo sync
          sudo umount /mnt/r
          sudo losetup -d "$LOOP"
          echo "注入完成"
          # 注入改动了镜像内容，Armbian 产出的 .sha 已失效 → 重算。
          # 注意：本步骤的 cwd 是仓库根目录（不是 build/），所以路径必须带 build/ 前缀。
          # 之前的 `cd output/images` 会失败，而 `set -e` 不会因 && 链里的 cd 失败退出，
          # 结果整条链被静默跳过，artifact 里留下的是「注入驱动之前」的旧 sha256
          # （2026-11-05 jammy 构建踩到：实测 c3a36b97… vs 打包的 444893e0…）。
          IMG_PATH=$(ls -1 build/output/images/*.img | head -1)
          ( cd build/output/images && sha256sum -b "$(basename "${IMG_PATH}")" \
              | awk '{print $1"  "$2}' > "$(basename "${IMG_PATH}").sha" )
          IMG_PATH=$(realpath "${IMG_PATH}")
          echo "重算 sha256:"
          cat "${IMG_PATH}.sha"
          # 自校验：算出来的必须和刚写的文件一致，否则直接失败，避免再发错 sha
          ACTUAL=$(sha256sum -b "${IMG_PATH}" | awk '{print $1}')
          DECLARED=$(awk '{print $1}' "${IMG_PATH}.sha")
          [[ "${ACTUAL}" == "${DECLARED}" ]] || { echo "!! sha256 重算失败"; exit 1; }
          echo "✅ sha256 自校验通过: ${ACTUAL}"

      - name: 验证镜像内容（面板 DTB + panel-simple-dsi.ko + 触摸固件）
        working-directory: build
        run: |
          set -e
          IMG=$(ls output/images/*.img | head -1)
          echo "image: $IMG ($(stat -c %s "$IMG") bytes)"
          for pat in "panel-dsi-simple" "panel-simple-dsi.ko" "gslx680_fw.fw" "aic8800_fdrv.ko" "aic8800_bsp.ko"; do
            if grep -qaF "$pat" "$IMG"; then
              echo "✅ $pat 已在镜像中"
            else
              echo "!! 镜像缺少 $pat"
              exit 1
            fi
          done
          # silead 内核补丁是否生效：优先看模块，内建则看内核镜像。
          # 仅提示，不作为失败条件（模块可能被压缩或内建）。
          if strings output/debs/linux-image-*.deb 2>/dev/null | grep -q "Firmware page switch error"; then
            echo "✅ silead GSLX680 补丁已包含在内核 deb 中"
          else
            echo "⚠️ 未在 deb 中确认补丁字符串，请核对构建日志里 1000-input-silead 补丁是否应用"
          fi
          # RK960 注入验证（编译失败时镜像可能不含，仅提示）
          for pat in "rk960_wifi.bin" "rk960_bt_loader.bin" "rk960-bt.service"; do
            if grep -qaF "$pat" "$IMG"; then
              echo "✅ RK960: $pat 已在镜像中"
            else
              echo "⚠️ RK960: $pat 不在镜像中（驱动/工具编译失败时属预期）"
            fi
          done

      - name: 结果信息
        if: always()
        run: |
          echo "=== images ==="
          ls -lh build/output/images/ 2>/dev/null || true
          echo "=== dtb in image target ==="
          ls -l build/output/images/*.img 2>/dev/null || true

      - name: 上传镜像
        # 即便后续步骤失败也把已编好的镜像传出来，避免 2 小时构建白费
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armbian-rk3566-evb2-lp4x-v10-${{ inputs.branch || 'current' }}-${{ inputs.release || 'bookworm' }}${{ inputs.desktop == true && format('-{0}-desktop', inputs.desktop_env) || '' }}
          path: |
            build/output/images/*.img
            build/output/images/*.img.*
            build/output/images/*.txt
            build/output/images/*.sha
          if-no-files-found: ignore
          retention-days: 15
          compression-level: 0
