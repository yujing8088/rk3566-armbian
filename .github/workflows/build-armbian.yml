name: build-armbian

# 云端编译 Armbian for RK3566 EVB2 LP4X V10
# 推送仓库 -> Actions -> build-armbian -> Run workflow -> 约 40~90 分钟后下载 artifact

on:
  workflow_dispatch:
    inputs:
      release:
        description: "发行版 (bookworm / noble / trixie)"
        type: choice
        options: [bookworm, noble, trixie]
        default: bookworm
      branch:
        description: "内核分支 (current / edge)"
        type: choice
        options: [current, edge]
        default: current
      minimal:
        description: "最小化镜像（不含桌面）"
        type: boolean
        default: true
  push:
    paths:
      - "dts/**"
      - "drivers/**"
      - "userpatches/**"
      - ".github/workflows/build-armbian.yml"

permissions:
  contents: read

concurrency:
  group: build-armbian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 环境自检（dtb 必须在）
        run: |
          set -e
          test -f userpatches/dtb/rk3566-evb2-lp4x-v10.dtb || { echo "缺少 userpatches/dtb/*.dtb"; exit 1; }
          BOARD_FILE=$(ls userpatches/config/boards/rk3566-evb2-lp4x-v10.* | head -1)
          echo "board config: $BOARD_FILE"
          ls -l userpatches/dtb/ dts/
          df -h /

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/az /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: 增加 swap（防止内核编译 OOM）
        run: |
          echo "--- before ---"; free -h; sudo swapon --show || true
          # 托管 runner 自带的 /swapfile 正在使用中（fallocate 会报 Text file busy），
          # 所以另开一个文件，只在现有 swap 不足 4GB 时添加
          CUR_MB=$(free -m | awk '/^Swap:/{print $2}')
          if [ "${CUR_MB:-0}" -lt 4096 ]; then
            sudo rm -f /swapfile2
            sudo fallocate -l 6G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=6144
            sudo chmod 600 /swapfile2
            sudo mkswap /swapfile2
            sudo swapon /swapfile2
          else
            echo "已有 ${CUR_MB}MB swap，跳过"
          fi
          echo "--- after ---"; free -h; df -h /

      - name: 注册 qemu binfmt（arm64 chroot 必需）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 获取 Armbian 构建框架
        run: git clone --depth 1 https://github.com/armbian/build.git build

      - name: 注入板级支持
        run: |
          set -e
          mkdir -p build/userpatches
          cp -rv userpatches/config build/userpatches/
          cp -rv userpatches/dtb    build/userpatches/
          # 新版 Armbian（python 补丁系统）的用户补丁目录不带 patch/ 层：
          # build/userpatches/kernel/archive/<series>/（日志 "User patches directory
          # for kernel [/armbian/userpatches/kernel/archive/rockchip64-6.18]"）。
          # 旧版补丁层路径也一并保留，兼容两种布局。
          if [ -d userpatches/patch ]; then
            cp -rv userpatches/patch build/userpatches/
            mkdir -p build/userpatches/kernel
            cp -rv userpatches/patch/kernel/. build/userpatches/kernel/
          fi
          if [ -d userpatches/kernel ]; then
            mkdir -p build/userpatches/kernel
            cp -rv userpatches/kernel/. build/userpatches/kernel/
          fi
          [ -d userpatches/firmware ] && cp -rv userpatches/firmware build/userpatches/ || true
          ls -lR build/userpatches/kernel 2>/dev/null || true
          ls -l build/userpatches/dtb/ build/userpatches/config/boards/

      - name: 编译 Armbian
        working-directory: build
        env:
          RELEASE: ${{ inputs.release || 'bookworm' }}
          BRANCH: ${{ inputs.branch || 'current' }}
        run: |
          set -o pipefail
          # USE_LOCAL_APT_DEB_CACHE=no：关闭「宿主 apt 缓存拷贝进镜像」优化。
          # 托管 runner 上该缓存多次产出损坏的 lists 文件，导致镜像内
          # apt-get update 报 getline (12: Cannot allocate memory) 而构建失败。
          #
          # 注意：面板驱动用的是 Armbian 内置 panel-dsi-simple（panel-simple-dsi.ko），
          # 不需要内核补丁。触摸需要内核补丁（silead.c 的 GSLX680 下载协议），
          # 所以必须 ARTIFACT_IGNORE_CACHE=yes —— 内核 artifact 的缓存哈希不含
          # userpatches 内容，命中缓存会导致补丁从未被编译进去。
          ARTIFACT_IGNORE_CACHE=yes \
          ./compile.sh build \
            BOARD=rk3566-evb2-lp4x-v10 \
            BRANCH="${BRANCH}" \
            RELEASE="${RELEASE}" \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            EXPERT=yes \
            USE_LOCAL_APT_DEB_CACHE=no \
            SHARE_LOG=no

      - name: 编译 AIC8800 无线/蓝牙驱动（在 Armbian 构建容器内，环境与内核完全一致）
        working-directory: build
        run: |
          set -e
          KREL=$(ls -d cache/sources/linux-kernel-worktree/*/ | head -1)
          echo "KSRC=$KREL"
          test -f "${KREL}.config" || { echo "内核树缺少 .config"; exit 1; }
          # 必须在 Armbian 的 docker 构建容器里编：
          #  - 宿主机没有交叉 gcc（工具链在镜像内）
          #  - 内核树里的 modpost 等宿主工具是容器内 glibc2.38 构建的，
          #    在 runner 宿主机(glibc2.35) 上跑不了
          #  - gcc 版本、modpost、BTI/PAC 代码生成必须与内核构建时完全一致，
          #    否则 insmod 会在 ftrace_init_nop -> patch_map 触发 BUG（实测）
          IMG=ghcr.io/armbian/docker-armbian-build:armbian-debian-trixie-latest
          docker image inspect "$IMG" >/dev/null 2>&1 || docker pull "$IMG"
          docker run --rm \
            -v "$PWD:/work" -v "$GITHUB_WORKSPACE:/src" -w /work \
            -e KREL="$KREL" \
            "$IMG" bash -lc '
              set -e
              cd "/work/$KREL"
              echo -n "kernel build gcc: "; grep -m1 -oP "Linux version.*" include/generated/compile.h 2>/dev/null || true
              echo -n "container gcc: "; aarch64-linux-gnu-gcc --version | head -1
              make M=/src/drivers/aic8800 ARCH=arm64 \
                   CROSS_COMPILE=aarch64-linux-gnu- \
                   KCFLAGS="-Wno-error" -k -j"$(nproc)" modules
            '
          ls -l "$GITHUB_WORKSPACE"/drivers/aic8800/*/*.ko
          modinfo -F vermagic "$GITHUB_WORKSPACE"/drivers/aic8800/aic8800_bsp/aic8800_bsp.ko

      - name: 上传驱动模块（失败也能单独装到板上）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-modules
          path: drivers/aic8800/*/*.ko
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 6

      - name: 把 AIC8800 驱动注入镜像 rootfs
        run: |
          set -e
          IMG=$(ls build/output/images/*.img | head -1)
          echo "image: $IMG"
          LOOP=$(sudo losetup -fP --show "$IMG")
          echo "loop: $LOOP"
          sudo partprobe "$LOOP" || true
          sleep 2
          ROOTPART="${LOOP}p1"
          [ -b "$ROOTPART" ] || ROOTPART=$(ls ${LOOP}p* | tail -1)
          echo "rootfs: $ROOTPART"
          sudo mkdir -p /mnt/r
          sudo mount "$ROOTPART" /mnt/r
          KVER=$(ls /mnt/r/lib/modules | head -1)
          echo "KVER=$KVER"
          sudo mkdir -p "/mnt/r/lib/modules/$KVER/extra"
          sudo cp drivers/aic8800/*/*.ko "/mnt/r/lib/modules/$KVER/extra/"
          sudo depmod -b /mnt/r "$KVER"
          grep -q aic8800 "/mnt/r/lib/modules/$KVER/modules.dep" && echo "✅ modules.dep 已含 aic8800"
          printf 'aic8800_bsp\naic8800_fdrv\n' | sudo tee /mnt/r/etc/modules-load.d/aic8800.conf
          # 固件实际在 /lib/firmware/aic8800/SDIO/<芯片>/ 下，用模块参数覆盖默认路径
          sudo mkdir -p /mnt/r/etc/modprobe.d
          printf 'options aic8800_bsp aic_fw_path=/lib/firmware/aic8800/SDIO/aic8800D80\n' \
            | sudo tee /mnt/r/etc/modprobe.d/aic8800.conf
          sudo sync
          sudo umount /mnt/r
          sudo losetup -d "$LOOP"
          echo "注入完成"
          # 注入改动了镜像内容，Armbian 产出的 .sha 已失效 → 重算
          cd output/images && IMG=$(ls -1 *.img | head -1) && sha256sum -b "$IMG" | awk '{print $1"  "$2}' > "${IMG}.sha"
          echo "重算 sha256:"; cat "${IMG}.sha"

      - name: 验证镜像内容（面板 DTB + panel-simple-dsi.ko + 触摸固件）
        working-directory: build
        run: |
          set -e
          IMG=$(ls output/images/*.img | head -1)
          echo "image: $IMG ($(stat -c %s "$IMG") bytes)"
          for pat in "panel-dsi-simple" "panel-simple-dsi.ko" "gslx680_fw.fw" "aic8800_fdrv.ko" "aic8800_bsp.ko"; do
            if grep -qaF "$pat" "$IMG"; then
              echo "✅ $pat 已在镜像中"
            else
              echo "!! 镜像缺少 $pat"
              exit 1
            fi
          done
          # silead 内核补丁是否生效：优先看模块，内建则看内核镜像。
          # 仅提示，不作为失败条件（模块可能被压缩或内建）。
          if strings output/debs/linux-image-*.deb 2>/dev/null | grep -q "Firmware page switch error"; then
            echo "✅ silead GSLX680 补丁已包含在内核 deb 中"
          else
            echo "⚠️ 未在 deb 中确认补丁字符串，请核对构建日志里 1000-input-silead 补丁是否应用"
          fi

      - name: 结果信息
        if: always()
        run: |
          echo "=== images ==="
          ls -lh build/output/images/ 2>/dev/null || true
          echo "=== dtb in image target ==="
          ls -l build/output/images/*.img 2>/dev/null || true

      - name: 上传镜像
        # 即便后续步骤失败也把已编好的镜像传出来，避免 2 小时构建白费
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armbian-rk3566-evb2-lp4x-v10-${{ inputs.branch || 'current' }}-${{ inputs.release || 'bookworm' }}
          path: |
            build/output/images/*.img
            build/output/images/*.img.*
            build/output/images/*.txt
            build/output/images/*.sha
          if-no-files-found: ignore
          retention-days: 15
          compression-level: 0
